services:
  blog:
    image: ps_blog_api:latest
    environment:
      DATABASE_URL: postgres://postgres@db:5432/blogdb
      RUST_LOG: info
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app_network
  db:
    image: postgres:16
    container_name: postgres_mahoney_blog
    restart: always
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    networks:
      - app_network
networks:
  app_network:
